name: Release
on:
  push:
    tags: ['v[0-9]*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  native:
    name: Build ${{ matrix.target }}
    needs: checks
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: macos-15, target: macos-arm64}
          - {os: macos-15-intel, target: macos-x86_64}
          - {os: ubuntu-22.04, target: linux-x86_64}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: '0.13.5'
          python-version: '3.13'
          enable-cache: true
      - run: uv sync --locked --group build
      - name: Verify version tag
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: uv run --locked python -B scripts/check_release.py version --tag "$RELEASE_TAG"
      - name: Build and smoke-test native distribution
        run: uv run --locked --group build python -B scripts/build_release.py --output "$RUNNER_TEMP/native-dist" --platform "${{ matrix.target }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-${{ matrix.target }}
          path: ${{ runner.temp }}/native-dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish complete GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [checks, native]
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: ${{ runner.temp }}/release-assets
          merge-multiple: true
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: '0.13.5'
          python-version: '3.13'
      - name: Validate all assets and write checksums
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: uv run --locked python -B scripts/check_release.py prepare "$RUNNER_TEMP/release-assets" --tag "$RELEASE_TAG" --notes "$RUNNER_TEMP/release-notes.md"
      - name: Upload to draft, then publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --json isDraft > "$RUNNER_TEMP/existing-release.json" 2>/dev/null; then
            python3 -c 'import json,sys; assert json.load(open(sys.argv[1]))["isDraft"], "Refusing to overwrite a published release"' "$RUNNER_TEMP/existing-release.json"
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "$RELEASE_TAG" --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
          gh release upload "$RELEASE_TAG" "$RUNNER_TEMP"/release-assets/* --clobber
          gh release edit "$RELEASE_TAG" --notes-file "$RUNNER_TEMP/release-notes.md" --draft=false
