[project]
name = "kestrel-drop-manager"
version = "0.15.5"
description = "Local Kestrel DROP D1/D2/D3 download manager and terminal UI"
requires-python = ">=3.11"
dependencies = ["bleak>=0.22,<4"]

[project.optional-dependencies]
viewer = ["streamlit>=1.66,<2", "altair>=5,<7", "pandas>=2,<4"]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project.scripts]
kestrel-drop = "kestrel_drop.manager:main"

[dependency-groups]
lint = ["ruff>=0.14,<1"]
build = ["build>=1.2,<2", "hatchling==1.27.0", "pyinstaller>=6.16,<7"]

[tool.hatch.build.targets.wheel]
packages = ["kestrel_drop"]

[tool.hatch.build.targets.sdist]
include = ["/kestrel_drop", "/tests", "/scripts", "/packaging", "/docs", "/README.md", "/CHANGELOG.md", "/Kestrel.command", "/kestrel.py", "/pyproject.toml", "/uv.lock"]

[tool.ruff]
exclude = ["KestrelDocuments", "data", "archive"]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
